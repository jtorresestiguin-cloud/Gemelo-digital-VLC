name: Vídeo para redes (comprimir y publicar)

# Toma los vídeos de una ejecución de «Vídeo para redes», los comprime a un tamaño
# apto para redes sociales (< 100 MB) y los deja en la rama «videos» junto con
# varias capturas de control.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID de la ejecución de «Vídeo para redes»'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      # lo que ya hubiera publicado (p. ej. el otro formato) se conserva
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: videos
          path: videos
      - run: rm -rf videos/.git
      - uses: actions/download-artifact@v4
        with:
          pattern: video-*
          path: in
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Comprimir (H.264, ~8 Mbps, compatible con todas las redes)
        run: |
          mkdir -p videos
          cp in/portada-*.jpg videos/
          for f in in/*.mp4; do
            out="videos/$(basename "$f")"
            ffmpeg -y -i "$f" -c:v libx264 -preset slow -crf 22 -maxrate 8M -bufsize 16M \
              -pix_fmt yuv420p -profile:v high -level 4.2 -r 25 -c:a aac -b:a 160k -movflags +faststart "$out"
            # capturas de control: 1 cada 8 s
            name=$(basename "$f" .mp4)
            ffmpeg -y -i "$out" -vf "fps=1/8,scale=640:-2" -q:v 4 "videos/control-${name}-%02d.jpg"
          done
          ls -la videos
      - name: Publicar en la rama «videos»
        run: |
          cd videos
          git init -q -b videos
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Vídeo del gemelo digital para redes"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" videos
