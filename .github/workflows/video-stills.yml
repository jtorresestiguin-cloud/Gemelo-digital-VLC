name: Vídeo para redes (fotos de control)

# Dibuja solo un fotograma por escena del guion, en los dos formatos, para revisar el vídeo
# en unos minutos antes de grabarlo entero. Las fotos quedan como artefacto «fotos-*».
on:
  workflow_dispatch:
    inputs:
      video:
        description: 'Guion: tour o features'
        default: 'features'

permissions:
  contents: read

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        format: [horizontal, vertical]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0 tsx@4
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y -q fonts-inter || true
      - run: npx tsx scripts/video.mts
        env:
          FORMAT: ${{ matrix.format }}
          FPS: 25
          STILLS: 1
          VIDEO: ${{ inputs.video }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fotos-${{ matrix.format }}
          path: video/frames-${{ matrix.format }}/
          retention-days: 3
