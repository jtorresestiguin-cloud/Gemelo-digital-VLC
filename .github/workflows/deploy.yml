name: Desplegar en GitHub Pages

# Se compila y prueba en cualquier rama; solo se publica desde la rama por defecto del repositorio.
on:
  push:
  workflow_dispatch:
  # cada madrugada, para renovar el horario de Cercanías de los próximos días
  schedule:
    - cron: '41 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Cercanías (líneas, estaciones y horarios desde el GTFS de Renfe)
        # si Renfe no responde, se publica con las líneas guardadas en el repositorio y sin horarios
        run: npm i --no-save tsx@4 && npx tsx scripts/build-cercanias.ts || echo "::warning::No se pudo generar el horario de Cercanías"
      - run: npm run build
        env:
          # opcional: clave de Google Maps Platform para la vista fotorrealista 3D
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          # token de Cesium ion para la vista fotorrealista (secreto del repositorio)
          VITE_CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
