name: Vídeo para redes

# Graba un vídeo del gemelo digital PUBLICADO (ciudad fotorrealista) en formato
# horizontal (16:9) y vertical (9:16) y lo deja en la rama «videos» y como artefacto.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Duración máxima en segundos (0 = vídeo completo; útil para pruebas)'
        default: '0'
      fps:
        description: 'Fotogramas por segundo'
        default: '25'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        format: [horizontal, vertical]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0 tsx@4
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-inter
      - run: npx tsx scripts/video.mts
        env:
          FORMAT: ${{ matrix.format }}
          MAX_SECONDS: ${{ inputs.seconds }}
          FPS: ${{ inputs.fps }}
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.format }}
          path: |
            video/*.mp4
            video/portada-*.jpg

  publish:
    needs: record
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: videos
          merge-multiple: true
      - name: Publicar en la rama «videos»
        run: |
          cd videos
          ls -la
          git init -q -b videos
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Vídeo del gemelo digital para redes"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" videos
