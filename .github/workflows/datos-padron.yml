name: Datos del padrón (temporal)

# Descarga el padrón por barrios publicado por la Oficina d'Estadística y lo deja en la rama «datos-tmp».
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  padron:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Descargar
        run: |
          mkdir -p out && cd out
          UA="GemeloDigitalVLC/1.0 (datos abiertos; github actions)"
          for t in "Anexo:Barrios_de_Valencia" "Distritos_de_Valencia"; do
            curl -sSL -A "$UA" -o "wiki-es-$t.txt" "https://es.wikipedia.org/w/index.php?title=$t&action=raw" || true
          done
          curl -sSL -A "$UA" -o "wiki-ca-barris.txt" "https://ca.wikipedia.org/w/index.php?title=Llista_de_barris_de_Val%C3%A8ncia&action=raw" || true
          curl -sSL -A "$UA" -o "wiki-ca-districtes.txt" "https://ca.wikipedia.org/w/index.php?title=Districtes_de_Val%C3%A8ncia&action=raw" || true
          # INE: búsqueda de tablas de población por sección censal (padrón continuo)
          curl -sSL -o ine-buscar.json "https://servicios.ine.es/wstempus/js/ES/TABLAS_OPERACION/22?det=0" || true
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o padron2024.pdf "https://www.valencia.es/estadistica/Padron/2024/Padron2024Cast.pdf" || true
          ls -la
          head -c 600 wiki-es-Anexo:Barrios_de_Valencia.txt || true
      - name: Publicar
        run: |
          cd out
          git init -q -b datos-tmp
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "padrón"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" datos-tmp
